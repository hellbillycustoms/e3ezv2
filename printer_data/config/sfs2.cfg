[filament_switch_sensor switch_sensor]
switch_pin: ^PC5
pause_on_runout: True
runout_gcode:
  PAUSE # [pause_resume] is required in printer.cfg
  M117 Out of Filament
insert_gcode:
  M117 Resuming

[filament_motion_sensor encoder_sensor]
switch_pin: ^PB1
detection_length: 4
extruder: extruder
pause_on_runout: True
runout_gcode:
  PAUSE # [pause_resume] is required in printer.cfg
  M117 Filament Jammed
insert_gcode:
  M117 Resuming
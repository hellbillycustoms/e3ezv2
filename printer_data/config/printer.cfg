[adxl345]
cs_pin: PC15
spi_software_sclk_pin: PC10
spi_software_mosi_pin: PC12
spi_software_miso_pin: PC11

[resonance_tester]
accel_chip: adxl345
probe_points: 117.5, 117.5, 20

[input_shaper]
shaper_freq_x: 66
shaper_type_x: 2hump_ei
shaper_freq_y: 40.4
shaper_type_y: mzv

[bed_screws]
screw1: 30.5, 37
screw2: 30.5, 207
screw3: 204.5, 207
screw4: 204.5, 37

[screws_tilt_adjust]
screw1: 65.5, 86.5
screw1_name:left front
screw2: 235, 86.5
screw2_name:right front
screw3: 235, 234.5
screw3_name:right rear
screw4: 65.5, 234.5
screw4_name:left rear
speed: 100
horizontal_move_z: 5
screw_thread: CW-M3

[display]
lcd_type: st7920
cs_pin: EXP1_7
sclk_pin: EXP1_6
sid_pin: EXP1_8
encoder_pins: ^EXP1_5, ^EXP1_3
click_pin: ^!EXP1_2

[output_pin beeper]
pin: EXP1_1

[skew_correction]



# MACROS

[gcode_macro START_PRINT]
gcode:
    G28
    {% set BED_TEMP = params.BED_TEMP|default(60)|float %}
    {% set EXTRUDER_TEMP = params.EXTRUDER_TEMP|default(190)|float %}
    M140 S{BED_TEMP}
    G90
    SET_GCODE_OFFSET Z=0.0
    G1 Z5 F3000
    M190 S{BED_TEMP}
    BED_MESH_CALIBRATE ADAPTIVE=1 METHOD=rapid_scan
    BED_MESH_PROFILE SAVE=latest
    BED_MESH_PROFILE LOAD=latest
    Smart_Park
    M109 S{EXTRUDER_TEMP}
    LINE_PURGE
    #SKEW_PROFILE LOAD=Califlower
    BED_MESH_PROFILE load=default

[gcode_macro END_PRINT]
gcode:
    #SET_SKEW CLEAR=1
    M140 S0
    M104 S0
    M106 S0
    G91
    G28 X
    G1 E-3 F300
    G1 Z10 F3000
    G90
    M84

[gcode_macro FILAMENT_LOAD]
gcode:
    M83                   # Put the extruder into relative mode
    G92 E0.0              # Reset the extruder so that it thinks it is at position zero
    G1 E50 F300          # Move the extruder forward 50mm at a speed of 5mm/s
    G92 E0.0              # Reset the extruder again
    M82                   # Put the extruder back into absolute mode.

[gcode_macro FILAMENT_UNLOAD]
gcode:
    M83                   # Put the extruder into relative mode
    G92 E150              # Reset the extruder so that it thinks it is at 150mm
    G1 E-50 F350          # Move the extruder backwards 50mm at a speed of 5mm/s
    G92 E0.0              # Reset the extruder 
    M82                   # Put the extruder back into absolute mode.

[gcode_macro SCREWS_TILT_CALIBRATE]
gcode:
    SCREWS_TILT_CALCULATE

[exclude_object]

[gcode_arcs]

[gcode_macro M600]
gcode:
    #LCDRGB R=0 G=1 B=0  ; Turn LCD green
    PAUSE                ; Pause


[virtual_sdcard]
path: ~/printer_data/gcodes
[display_status]
[pause_resume]

[firmware_retraction]
retract_length: 0.8       #   The length of filament (in mm) to retract when G10 is activated,
                          #   and to unretract when G11 is activated (but see
                          #   unretract_extra_length below). The default is 0 mm.
retract_speed: 45         #   The speed of retraction, in mm/s. The default is 20 mm/s.
unretract_extra_length: 0 #   The length (in mm) of *additional* filament to add when unretracting.
unretract_speed: 10       #   The speed of unretraction, in mm/s. The default is 10 mm/s.

